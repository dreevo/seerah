# ============================================================================
#  Seerah platform — the whole backend as one command:  docker compose up
#
#  Brings up Postgres + the Spring Boot read API (with the full Qur'an and every
#  chronicle seeded on first boot). The Angular reader runs separately in dev
#  (`cd frontend && npm start`, proxied to :8080) or is built and served static.
#
#  The service is read-only: no auth, no message broker, no second search engine.
# ============================================================================
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: seerah
      POSTGRES_PASSWORD: seerah
      POSTGRES_DB: seerah
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seerah"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - seerah-db:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/seerah
      DB_USER: seerah
      DB_PASSWORD: seerah
      # Load the full Qur'an + every chronicle on first boot.
      SEERAH_SEED: "true"
    command: ["--seerah.seed=true"]
    ports:
      - "8080:8080"

volumes:
  seerah-db:
