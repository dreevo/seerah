spring:
  application:
    name: seerah-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seerah}
    username: ${DB_USER:seerah}
    password: ${DB_PASSWORD:seerah}
  jpa:
    open-in-view: false          # §23: no lazy loading across the web boundary
    hibernate:
      ddl-auto: none             # §5.4 / §5.3: Flyway owns the schema, not Hibernate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      # §26.3 — request handling on virtual threads
      max: 200

# Virtual threads for Tomcat request handling (§26.3)
  # (spring.threads.virtual.enabled is the switch)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.flywaydb: info
